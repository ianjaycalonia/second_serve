<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Donors Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/scripts/css/availableDonation.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- for Mobile -->
<div class="offcanvas offcanvas-start sidebar" tabindex="-1" id="sidebarOffcanvas">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title text-gray">Menu</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <nav class="nav flex-column px-2">
      <a href="recipientDashboard.html" class="nav-link"><i class="bi bi-house-door-fill me-2"></i>Dashboard</a>
    <a href="availableDonation.html" class="nav-link active"><i class="bi bi-box-seam me-2"></i>Available Donations</a>
    <a href="recipientHistory.html" class="nav-link"><i class="bi bi-building-add me-2"></i>History</a>
  </div>
</div>

<!-- Navbar -->
<nav class="navbar fixed-top navbar-expand-lg" style="background-color: #ffe0b3; z-index: 1030;">
  <div class="container-fluid">
    <button class="btn d-lg-none me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas">
      <i class="bi bi-list fs-3"></i>
    </button>
    <div class="text-center mb-1 mt-1 ms-2">
      <span class="navbar-brand fw-semibold">Second Serve by Simply Share</span>
    </div>
    <div class="d-flex align-items-center ms-auto">
      <input type="search" class="form-control me-3 d-none d-md-block" placeholder="Search..." style="width: 200px;">
      <a class="nav-link me-3" href="#"><i class="bi bi-bell-fill fs-5"></i></a>
      <a class="nav-link me-3" href="#"><i class="bi bi-envelope-fill fs-5"></i></a>
      <div class="dropdown">
        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-person-circle fs-5"></i>
        </a>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
          <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger logout-btn" href="#"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<!-- Sidebar for Desktop -->
<div class="sidebar d-none d-lg-flex flex-column position-fixed">
  <nav class="side_nav nav flex-column px-3">
    <a href="recipientDashboard.html" class="nav-link"><i class="bi bi-house-door-fill me-2"></i>Dashboard</a>
    <a href="availableDonation.html" class="nav-link active"><i class="bi bi-box-seam me-2"></i>Available Donations</a>
    <a href="recipientHistory.html" class="nav-link"><i class="bi bi-building-add me-2"></i>History</a>
  </nav>
</div>

<!-- Main Content -->
<div class="main-content">
  <main class="container-fluid py-4">
    <h5 class="ms-3">Available Donations</h5>

    <div class="content-wrapper">
      <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
        <h4 class="title w-100 text-center">Available Items</h4>
        <div class="ms-auto">
          <button class="btn btn-warning-custom btn-sm">Request an Item</button>
        </div>
      </div>

      <div class="d-flex flex-wrap gap-3 justify-content-center align-items-center mb-3 filters">
        <div class="d-flex align-items-center gap-2">
          <label class="fw-semibold">Category:</label>
          <select class="form-select form-select-sm">
            <option>None</option>
          </select>
        </div>
        <div class="d-flex align-items-center gap-2">
          <label class="fw-semibold">Location:</label>
          <select class="form-select form-select-sm">
            <option>None</option>
          </select>
        </div>
        <div class="d-flex align-items-center gap-2">
          <label class="fw-semibold">Sort by:</label>
          <select class="form-select form-select-sm">
            <option>Quantity</option>
          </select>
        </div>
        <div class="d-flex align-items-center gap-2">
          <label class="fw-semibold">Date Posted:</label>
          <select class="form-select form-select-sm">
            <option>All time</option>
          </select>
        </div>
      </div>
      <!-- Items -->
      <div class="item-grid">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
        <div class="item">9</div>
        <div class="item">10</div>
        <div class="item">11</div>
        <div class="item">12</div>
        <div class="item">13</div>
        <div class="item">14</div>
        <div class="item">15</div>
        <div class="item">16</div>
        <div class="item">17</div>
        <div class="item">18</div>
        <div class="item">19</div>
        <div class="item">20</div>
        <div class="item">21</div>
        <div class="item">22</div>
        <div class="item">23</div>
        <div class="item">24</div>
        <div class="item">25</div>
        <div class="item">26</div>
        <div class="item">27</div>
        <div class="item">28</div>
        <div class="item">29</div>
        <div class="item">30</div>
        <div class="item">31</div>
      </div>
    </div>
  </main>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="scripts/js/auth.js"></script>
</body>
</html>
