<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="images/simply_share.png" />
    <title>Second Serve: Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="scripts/css/dashboardLayout.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="sidebar-collapsed">
    <nav>
      <div class="nav-items">
        <div class="toggle">
          <button id="sidebarToggle" class="btn">
            <i class="bi bi-list fs-4"></i>
          </button>
          <img
            src="images/simply_share.png"
            alt="Simply Share Logo"
            class="logo"
          />
          <div class="brand d-none d-md-block">
            Second Serve by <span>Simply</span><span>Share</span>
          </div>
        </div>
        <div class="nav-icons">
          <a
            class="nav-link position-relative"
            href="#"
            data-bs-toggle="modal"
            data-bs-target="#notificationsModal"
            aria-label="Open notifications"
          >
            <img
              class="bell-icon"
              src="images/bell.gif"
              alt="Bell"
              width="40"
              height="40"
            />

            <span
              id="notificationsBadge"
              class="position-absolute badge-message rounded-pill bg-danger"
            ></span>
          </a>
          <a
            class="nav-link"
            href="#"
            data-bs-toggle="modal"
            data-bs-target="#messagesModal"
            aria-label="Open messages"
          >
            <img
              src="images/letter.gif"
              class="letter-icon"
              alt="Mail"
              width="35"
              height="35"
            />
            <span id="messagesBadge" class="badge bg-danger d-none">0</span>
          </a>

          <div class="dropdown">
            <a
              class="nav-link d-flex align-items-center dashboard-icon"
              href="#"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <img
                src="images/profile.png"
                alt="Dashboard Icon"
                width="25"
                height="25"
              />
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" href="recipientprofile.html">
                  <i class="bi bi-person me-2"></i>Profile
                </a>
              </li>
              <li><hr class="dropdown-divider" /></li>
              <li>
                <a class="dropdown-item text-danger logout-btn" href="#">
                  <i class="bi bi-box-arrow-right me-2"></i>Logout
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <div class="sidebar-backdrop"></div>

    <aside class="sidebar collapsed"></aside>

    <main>
      <div aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item active" aria-current="page">Dashboard</li>
        </ol>
      </div>

      <h5 class="mb-3">Welcome, <span class="user-name"></span></h5>

      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3">
        <div class="col">
          <div class="card card-accent h-100">
            <div class="card-body">
              <h6 class="card-title">Donations Received</h6>
              <div class="card-elements">
                <div class="card-icon">
                  <i class="bi bi-box2-heart-fill"></i>
                </div>
                <div class="card-text">
                  <h3 class="mb-0" id="totalDonations">0</h3>
                  <small class="text-muted">Received</small>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col">
          <div class="card card-accent h-100">
            <div class="card-body">
              <h6 class="card-title">Upcoming Deliveries</h6>
              <div class="card-elements">
                <div class="card-icon">
                  <i class="bi bi-calendar-week-fill"></i>
                </div>
                <div class="card-text">
                  <h3 class="mb-0" id="upcomingDonations">0</h3>
                  <small class="text-muted">Scheduled</small>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col">
          <div class="card card-accent h-100">
            <div class="card-body">
              <h6 class="card-title">Pending Deliveries</h6>
              <div class="card-elements">
                <div class="card-icon">
                  <i class="bi bi-clock-fill"></i>
                </div>
                <div class="card-text">
                  <h3 class="mb-0" id="activeDonors">0</h3>
                  <small class="text-muted">Pending</small>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col">
          <div class="card card-accent h-100">
            <div class="card-body">
              <h6 class="card-title">Missed Deliveries</h6>
              <div class="card-elements">
                <div class="card-icon">
                  <i class="bi bi-x-lg"></i>
                </div>
                <div class="card-text">
                  <h3 class="mb-0" id="activeRecipients">0</h3>
                  <small class="text-muted">Missed</small>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-9">
          <div class="card card-accent p-4 w-100 h-100">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="mb-0">Metrics</h6>
            </div>

            <div class="recipient-dashboard-chart">
              <canvas id="lineChart"></canvas>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-3">
          <div class="card card-accent p-4 w-100 h-100 d-flex flex-column">
            <div class="mb-3 text-start section-title">Activity Feed</div>
            <div class="flex-grow-1 activity-feed"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- Notifications Modal -->
    <div
      class="modal fade"
      id="notificationsModal"
      tabindex="-1"
      aria-labelledby="notificationsModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-scrollable modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="notificationsModalLabel">
              Notifications
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div id="notificationsList"></div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Messages Modal is injected by scripts/js/ui/messages.js on demand -->

    <!-- Toast Container -->
    <div
      class="toast-container position-fixed top-0 end-0 p-3 dashboard-toast-container"
    >
      <div
        id="feedbackToast"
        class="toast align-items-center text-bg-dark border-0"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="d-flex">
          <div class="toast-body" id="toastBody">Action completed.</div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <!-- Shared config and API modules -->
    <script src="scripts/js/config/constants.js?v=20250925"></script>
    <!-- Custom scripts -->
    <script src="scripts/js/utils/auth.js"></script>
    <script src="scripts/js/ui/messages.js"></script>
    <script src="scripts/js/ui/notifications.js"></script>
    <script src="scripts/js/ui/activityFeed.js"></script>
    <script src="scripts/js/ui/sidebar.js"></script>
    <script src="scripts/js/charts/recipientDashboard.js"></script>
    <script src="scripts/js/ui/animatedMessage.js"></script>
    <script src="scripts/js/ui/animatedNotification.js"></script>
    <script src="scripts/js/ui/animation.js"></script>
  </body>
</html>
