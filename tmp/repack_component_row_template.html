<template id="repackComponentRowTemplate">
  <div class="border rounded p-3 component-row" data-index="">
    <div class="row g-3 align-items-end">
      <div class="col-md-4">
        <label class="form-label small" data-field="name-label">Component Name</label>
        <input type="text" class="form-control component-name" placeholder="e.g., Rice" required />
      </div>
      <div class="col-md-2">
        <label class="form-label small" data-field="qty-label">Qty / Kit</label>
        <input type="number" class="form-control component-qty" min="1" step="1" required />
      </div>
      <div class="col-md-2">
        <label class="form-label small">Unit</label>
        <input type="text" class="form-control component-unit" placeholder="e.g., kg" list="repackUnitOptions" />
      </div>
      <div class="col-md-3">
        <label class="form-label small">Category</label>
        <input type="text" class="form-control component-category" placeholder="Primary - Secondary" list="repackCategoryOptions" />
      </div>
      <div class="col-md-1 text-end">
        <button type="button" class="btn btn-outline-danger btn-sm component-remove-btn" title="Remove component">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="col-md-12">
        <label class="form-label small mb-1">Notes</label>
        <textarea class="form-control component-notes" rows="1" placeholder="Optional"></textarea>
      </div>
    </div>
  </div>
</template>
