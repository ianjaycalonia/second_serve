<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donors Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="scripts/css/dashboardLayout.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="sidebar-collapsed">
    <nav>
      <div class="nav-items">
        <div class="toggle">
          <button id="sidebarToggle" class="btn">
            <i class="bi bi-list fs-4"></i>
          </button>
          <img
            src="images/simply_share.png"
            alt="Simply Share Logo"
            class="logo"
          />
          <div class="brand d-none d-md-block">
            Second Serve by <span>Simply</span><span>Share</span>
          </div>
        </div>
        <div class="nav-icons">
          <a
            class="nav-link me-3 position-relative"
            href="#"
            data-bs-toggle="modal"
            data-bs-target="#notificationsModal"
            aria-label="Open notifications"
          >
            <i class="bi bi-bell-fill fs-5"></i>
            <span
              id="notificationsBadge"
              class="position-absolute translate-middle badge rounded-pill bg-danger"
              style="top: 6px; right: 2px; display: none; font-size: 0.6rem"
            ></span>
          </a>
          <a
            class="nav-link me-3"
            href="#"
            data-bs-toggle="modal"
            data-bs-target="#messagesModal"
            aria-label="Open messages"
          >
            <i class="bi bi-envelope-fill fs-5"></i>
          </a>
          <div class="dropdown">
            <a
              class="nav-link dropdown-toggle d-flex align-items-center"
              href="#"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <i class="bi bi-person-circle fs-5"></i>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" href="#"
                  ><i class="bi bi-person me-2"></i>Profile</a
                >
              </li>
              <li>
                <a class="dropdown-item" href="#"
                  ><i class="bi bi-gear me-2"></i>Settings</a
                >
              </li>
              <li><hr class="dropdown-divider" /></li>
              <li>
                <a class="dropdown-item text-danger logout-btn" href="#"
                  ><i class="bi bi-box-arrow-right me-2"></i>Logout</a
                >
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <div class="sidebar-backdrop" style="display: none"></div>

    <aside class="collapsed">
      <a
        href="DonorDashboard.html"
        class="nav-link"
        data-bs-toggle="tooltip"
        data-bs-placement="right"
        data-bs-custom-class="custom-tooltip"
        data-bs-title="Dashboard"
        ><i class="bi bi-house-door-fill me-2"></i> <span>Dashboard</span></a
      >
      <a
        href="MyDonations.html"
        class="nav-link"
        data-bs-toggle="tooltip"
        data-bs-placement="right"
        data-bs-custom-class="custom-tooltip"
        data-bs-title="My Donations"
        ><i class="bi bi-box-seam me-2"></i> <span>My Donations</span></a
      >
      <a
        href="schedulePickups.html"
        class="nav-link active"
        data-bs-toggle="tooltip"
        data-bs-placement="right"
        data-bs-custom-class="custom-tooltip"
        data-bs-title="Schedule Pickups"
        ><i class="bi bi-building-add me-2"></i>
        <span>Schedule Pickups</span></a
      >
      <a
        href="donationHistory.html"
        class="nav-link"
        data-bs-toggle="tooltip"
        data-bs-placement="right"
        data-bs-custom-class="custom-tooltip"
        data-bs-title="Donation History"
        ><i class="bi bi-people me-2"></i> <span>Donation History</span></a
      >
    </aside>

    <!-- Main Content -->
    <main>
      <h2>Schedule a Pickup</h2>
      <div class="container">
        <form>
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Pickup Scheduling Form</h5>
              <div class="row mb-3">
                <div class="col-12 col-md-6">
                  <div class="row mb-3">
                    <div class="col-12">
                      <label for="pickupDate" class="form-label"
                        >Pickup Date</label
                      >
                      <input type="date" class="form-control" id="pickupDate" />
                    </div>
                  </div>
                  <div class="row mb-3">
                    <div class="col-12">
                      <label for="pickupTime" class="form-label"
                        >Pickup Time Window</label
                      >
                      <input
                        type="text"
                        class="form-control"
                        id="pickupTime"
                        placeholder="e.g., 9:00 AM - 12:00 PM"
                      />
                    </div>
                  </div>
                  <div class="row mb-3">
                    <div class="col-12">
                      <label for="pickupLocation" class="form-label"
                        >Pickup Location</label
                      >
                      <input
                        type="text"
                        class="form-control"
                        id="pickupLocation"
                        placeholder="e.g., Address or Location"
                      />
                    </div>
                  </div>
                  <div class="row mb-3">
                    <div class="col-12">
                      <label for="donationPreference" class="form-label"
                        >Donation Preference</label
                      >
                      <input
                        type="text"
                        class="form-control"
                        id="donationPreference"
                        placeholder="e.g., Clothes, Furniture"
                      />
                    </div>
                  </div>
                  <div class="row mb-3">
                    <div class="col-12">
                      <label for="additionalNotes" class="form-label"
                        >Additional Notes</label
                      >
                      <textarea
                        class="form-control"
                        id="additionalNotes"
                        rows="3"
                      ></textarea>
                    </div>
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <div class="row mb-3">
                    <div class="col-12">
                      <label for="photoUpload" class="form-label"
                        >Add a Photo</label
                      >
                      <input
                        type="file"
                        class="form-control"
                        id="photoUpload"
                        accept="image/*"
                        style="height: 430px"
                      />
                    </div>
                  </div>
                  <div class="row mb-3">
                    <div class="col-12 d-flex justify-content-center">
                      <button type="submit" class="btn btn-primary w-50">
                        Submit
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </main>

    <!-- Notifications Modal -->
    <div
      class="modal fade"
      id="notificationsModal"
      tabindex="-1"
      aria-labelledby="notificationsModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-scrollable modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="notificationsModalLabel">
              Notifications
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="list-group">
              <div class="list-group-item d-flex align-items-start">
                <i class="bi bi-bell me-3 text-warning"></i>
                <div>
                  <div class="fw-semibold">Example notification</div>
                  <small class="text-muted">Just now</small>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Messages Modal -->
    <div
      class="modal fade"
      id="messagesModal"
      tabindex="-1"
      aria-labelledby="messagesModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-scrollable modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="messagesModalLabel">Messages</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="d-flex" style="min-height: 300px">
              <div class="border-end pe-3 me-3" style="width: 220px">
                <input
                  class="form-control form-control-sm mb-2"
                  placeholder="Search conversations"
                />
                <div class="list-group small">
                  <a
                    href="#"
                    class="list-group-item list-group-item-action active"
                    >Cebu Food Bank</a
                  >
                  <a href="#" class="list-group-item list-group-item-action"
                    >Helping Hands</a
                  >
                </div>
              </div>
              <div class="flex-grow-1 d-flex flex-column">
                <div class="flex-grow-1 overflow-auto mb-2">
                  <div class="text-muted small mb-2">Today</div>
                  <div class="d-flex mb-2">
                    <div class="p-2 rounded bg-light">
                      Welcome to messaging!
                    </div>
                  </div>
                </div>
                <div class="input-group">
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Type a message..."
                  />
                  <button class="btn btn-warning" type="button">
                    <i class="bi bi-send"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/js/auth.js"></script>
    <script src="scripts/js/notifications.js"></script>
    <script src="scripts/js/sidebar.js"></script>
  </body>
</html>
